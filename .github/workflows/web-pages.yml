name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Flutter
        run: bash ./scripts/install_flutter_sdk.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build web app
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # A new service worker per deploy, so phones pick up the new version.
      - name: Stamp service worker with this build
        run: |
          sed -i "s/__BUILD_ID__/${GITHUB_SHA}/" build/web/sw.js
          echo "${GITHUB_SHA}" > build/web/build_id.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

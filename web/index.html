<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Organize your rewards and loyalty cards.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rewards Cards">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>

  <title>Rewards Cards</title>
  <link rel="manifest" href="manifest.json">

  <!-- Start downloading the app straight away, not after the loader runs. -->
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    html, body { margin: 0; background: #F5F1E7; }
    /* Shown until Flutter draws its first frame. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F5F1E7;
      transition: opacity 0.2s;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 250);
      }
    });

    // Called by the app's refresh button: asks sw.js to download a newer
    // version if one has been deployed, and resolves to whether it did.
    window.rewardsDownloadUpdate = async () => {
      const registration = await navigator.serviceWorker?.getRegistration();
      const worker = registration?.active;
      if (!worker) {
        return false;
      }
      return new Promise((resolve) => {
        const channel = new MessageChannel();
        channel.port1.onmessage = (event) => resolve(Boolean(event.data?.updated));
        worker.postMessage({ type: 'update-app' }, [channel.port2]);
        setTimeout(() => resolve(false), 60000);
      });
    };

    // Keeps the app's files on the device (see sw.js). Local dev servers run
    // on a port and are left alone.
    if ('serviceWorker' in navigator && !location.port) {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });

      // Hand over what this visit downloaded: once the app has drawn, and
      // again after Firebase has loaded in the background.
      const keepLoadedFiles = async () => {
        const registration = await navigator.serviceWorker.ready;
        registration.active?.postMessage({
          type: 'cache-loaded',
          urls: performance.getEntriesByType('resource').map((e) => e.name),
        });
      };
      window.addEventListener('flutter-first-frame', () => {
        keepLoadedFiles();
        setTimeout(keepLoadedFiles, 10000);
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
